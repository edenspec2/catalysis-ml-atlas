function nodeColor(n){const mode=document.getElementById("colorby").value;if(n._dim)return"#1c2430";if(n._selected)return"#ffffff";if(mode==="type")return typeColors[n.type]||"#9aa7b8";if(n.type!=="paper")return typeColors[n.type]||"#9aa7b8";if(mode==="paradigm")return paradigmColors[n.paradigm]||"#9aa7b8";if(mode==="group")return groupColors[primaryGroup(n)]||groupColors.Other;if(mode==="year")return yearColors[String(n.year)]||yearColors.Unknown;return"#9aa7b8"}function nodeVal(n){return n.type==="paper"?6.3:n.type==="author"?5.2:n.type==="workflow"?5.5:n.type==="topic"?4.7:n.type==="method"?4.4:5}function labelText(n){return n.type==="paper"?`${n.label} (${n.year||""})`:n.label}function makeSprite(n){const sp=new SpriteText(labelText(n));sp.material.depthWrite=false;sp.color=n._dim?"#5f6978":"#dbe5f5";sp.textHeight=n.type==="paper"?4.1:3.4;sp.backgroundColor="rgba(5,8,13,.72)";sp.padding=2;sp.borderRadius=2;return sp}
const Graph=ForceGraph3D()(document.getElementById("graph")).backgroundColor("#04060a").showNavInfo(false).enableNodeDrag(true).nodeId("id").nodeColor(nodeColor).nodeVal(n=>nodeVal(n)*(n._selected?1.5:1)).nodeLabel(n=>`<div style="background:#0b1320;color:white;border:1px solid #33425a;border-radius:8px;padding:7px 9px"><b>${esc(n.label)}</b><br><span style="color:#96a5bb">${esc(n.type)}${n.year?" · "+esc(n.year):""}${n.paradigm?" · "+esc(n.paradigm):""}</span></div>`).linkColor(l=>l._highlight?"rgba(130,205,255,.94)":l.relation==="paper_similarity"?"rgba(215,224,238,.12)":"rgba(255,255,255,.09)").linkWidth(l=>l._highlight?2.2:(l.relation==="paper_similarity"?Math.min(1.4,.35+(l.score||1)/10):.48)).onNodeClick(n=>selectNode(n.id)).onBackgroundClick(()=>clearSelection());Graph.d3Force("charge").strength(-48);Graph.d3Force("link").distance(l=>l.relation==="paper_similarity"?84:60);Graph.cooldownTicks(80);
function visibleTypes(view){if(view==="full")return new Set(["paper","author","topic","method","workflow","program"]);if(view==="papers")return new Set(["paper"]);if(view==="papers_authors")return new Set(["paper","author"]);if(view==="papers_topics")return new Set(["paper","topic"]);if(view==="papers_methods")return new Set(["paper","method"]);if(view==="papers_workflows")return new Set(["paper","workflow"]);return new Set(["paper"])}
function storyMatch(p){if(!activeStory)return true;const s=STORIES[activeStory];if(!s)return true;if(s.filter?.years&&!s.filter.years.includes(Number(p.year)))return false;if(s.filter?.relevance&&!s.filter.relevance.includes(p.relevance))return false;if(s.paradigms&&!s.paradigms.includes(p.paradigm))return false;if(s.groups&&!p.groups?.some(g=>s.groups.includes(g)))return false;if(s.keywords){const text=JSON.stringify(p).toLowerCase();if(!s.keywords.some(k=>text.includes(k)))return false}return true}
function buildData(){const view=document.getElementById("view").value,yr=document.getElementById("year").value,q=document.getElementById("q").value.trim().toLowerCase(),types=visibleTypes(view),hideReviews=document.getElementById("hideReviews").checked,density=document.getElementById("density").value;let ns=ALL_NODES.filter(n=>types.has(n.type));ns=ns.filter(n=>{if(n.type!=="paper")return true;if(yr!=="all"&&(yr==="older"?Number(n.year||0)>=2023:String(n.year)!==yr))return false;if(hideReviews&&["review","perspective","viewpoint"].includes((n.paper_type||"").toLowerCase()))return false;if(!storyMatch(n))return false;return true});if(q)ns=ns.filter(n=>JSON.stringify(n).toLowerCase().includes(q));let ids=new Set(ns.map(n=>n.id)),ls;if(view==="papers"){const lvl={sparse:1,normal:2,dense:3},allow=lvl[density];ls=PAPER_LINKS.filter(l=>ids.has(l.source)&&ids.has(l.target)&&lvl[l.density]<=allow)}else ls=META_LINKS.filter(l=>ids.has(eid(l.source))&&ids.has(eid(l.target)));if(document.getElementById("hideIsolates").checked){const linked=new Set();ls.forEach(l=>{linked.add(eid(l.source));linked.add(eid(l.target))});ns=ns.filter(n=>linked.has(n.id));ids=new Set(ns.map(n=>n.id));ls=ls.filter(l=>ids.has(eid(l.source))&&ids.has(eid(l.target)))}currentData={nodes:ns.map(n=>Object.assign({},n)),links:ls.map(l=>Object.assign({},l))};applyLayout(document.getElementById("layout").value,false);Graph.graphData(currentData);applyLabels();Graph.nodeColor(nodeColor).nodeVal(n=>nodeVal(n)*(n._selected?1.5:1));Graph.d3ReheatSimulation();setTimeout(()=>Graph.zoomToFit(450,55),120);updateHud();renderCurrent()}
function clearFixed(){currentData.nodes.forEach(n=>{n.fx=undefined;n.fy=undefined;n.fz=undefined})}function applyLayout(mode,reheat=true){clearFixed();if(mode==="free"){Graph.d3Force("charge").strength(-48);if(reheat){Graph.graphData(currentData);Graph.d3ReheatSimulation();setTimeout(()=>Graph.zoomToFit(500,55),120)}return}const ps=currentData.nodes.filter(n=>n.type==="paper");if(mode==="year"){const years=[...new Set(ps.map(p=>Number(p.year)||0))].sort((a,b)=>a-b),yi=Object.fromEntries(years.map((y,i)=>[y,i]));currentData.nodes.forEach(n=>{if(n.type==="paper"){n.fx=(yi[Number(n.year)||0]-(years.length-1)/2)*90;n.fy=((hash(n.id)%1000)/1000-.5)*180;n.fz=((hash(n.id+"z")%1000)/1000-.5)*130}})}else if(mode==="paradigm"){const cats=Object.keys(paradigmColors),ci=Object.fromEntries(cats.map((x,i)=>[x,i]));currentData.nodes.forEach(n=>{if(n.type==="paper"){const a=2*Math.PI*(ci[n.paradigm]||0)/cats.length,r=150;n.fx=r*Math.cos(a)+((hash(n.id)%100)/100-.5)*45;n.fy=r*Math.sin(a)+((hash(n.id+"y")%100)/100-.5)*45;n.fz=((hash(n.id+"z")%100)/100-.5)*80}})}else if(mode==="group"){const cats=Object.keys(groupColors),ci=Object.fromEntries(cats.map((x,i)=>[x,i]));currentData.nodes.forEach(n=>{if(n.type==="paper"){const g=primaryGroup(n),a=2*Math.PI*(ci[g]||0)/cats.length,r=160;n.fx=r*Math.cos(a)+((hash(n.id)%100)/100-.5)*45;n.fy=r*Math.sin(a)+((hash(n.id+"y")%100)/100-.5)*45;n.fz=((hash(n.id+"z")%100)/100-.5)*80}})}if(reheat){Graph.graphData(currentData);setTimeout(()=>Graph.zoomToFit(500,60),100)}}
function applyLabels(){const mode=document.getElementById("labels").value;if(mode==="hover"){Graph.nodeThreeObject(null);return}Graph.nodeThreeObject(n=>{const show=mode==="all"||(mode==="papers"&&n.type==="paper")||(mode==="selected"&&n._selected);return show?makeSprite(n):null}).nodeThreeObjectExtend(true)}
function neighborhood(id,hops){let s=new Set([id]),front=new Set([id]);for(let k=0;k<hops;k++){const nxt=new Set();currentData.links.forEach(l=>{let a=eid(l.source),b=eid(l.target);if(front.has(a)&&!s.has(b)){s.add(b);nxt.add(b)}if(front.has(b)&&!s.has(a)){s.add(a);nxt.add(a)}});front=nxt}return s}
function selectNode(id){if(currentSelection===id){clearSelection();return}currentSelection=id;const keep=neighborhood(id,Number(document.getElementById("focus").value));currentData.nodes.forEach(n=>{n._selected=n.id===id;n._dim=!keep.has(n.id)});currentData.links.forEach(l=>{let a=eid(l.source),b=eid(l.target);l._highlight=a===id||b===id});Graph.nodeColor(nodeColor).nodeVal(n=>nodeVal(n)*(n._selected?1.55:1)).linkColor(l=>l._highlight?"rgba(130,205,255,.95)":l.relation==="paper_similarity"?"rgba(255,255,255,.035)":"rgba(255,255,255,.025)").linkWidth(l=>l._highlight?2.3:.35);applyLabels();currentTab="details";activateTab("details");renderDetails()}
function clearSelection(){currentSelection=null;currentData.nodes.forEach(n=>{n._selected=false;n._dim=false});currentData.links.forEach(l=>l._highlight=false);Graph.nodeColor(nodeColor).nodeVal(nodeVal).linkColor(l=>l.relation==="paper_similarity"?"rgba(215,224,238,.12)":"rgba(255,255,255,.09)").linkWidth(l=>l.relation==="paper_similarity"?Math.min(1.4,.35+(l.score||1)/10):.48);applyLabels();renderCurrent()}
function updateHud(){document.getElementById("status").innerHTML=`<b>${currentData.nodes.length}</b> nodes · <b>${currentData.links.length}</b> links<br>${esc(document.getElementById("view").selectedOptions[0].textContent)} · ${esc(document.getElementById("layout").selectedOptions[0].textContent)}`;const mode=document.getElementById("colorby").value;let cmap=mode==="paradigm"?paradigmColors:mode==="group"?groupColors:mode==="year"?yearColors:typeColors;document.getElementById("legend").innerHTML=`<b>Color: ${esc(mode)}</b>`+Object.entries(cmap).slice(0,10).map(([k,v])=>`<div class="legendrow"><span class="swatch" style="background:${v}"></span>${esc(k)}</div>`).join("")}
function addCompare(id){if(!id||byId[id]?.type!=="paper")return;if(compareIds.includes(id))compareIds=compareIds.filter(x=>x!==id);else if(compareIds.length<4)compareIds.push(id);document.getElementById("compareBadge").textContent=`Compare ${compareIds.length}`;renderDetails()}
function renderOverview(){const p=document.getElementById("panel"),visiblePapers=currentData.nodes.filter(n=>n.type==="paper"),pc={};visiblePapers.forEach(x=>pc[x.paradigm]=(pc[x.paradigm]||0)+1);const top=Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,8),max=top[0]?.[1]||1;p.innerHTML=`<div class="metricgrid"><div class="card"><div class="metric">${allPapers.length}</div><div class="small">papers in corpus</div></div><div class="card"><div class="metric">${visiblePapers.length}</div><div class="small">visible papers</div></div><div class="card"><div class="metric">${new Set(allPapers.flatMap(x=>x.groups||[])).size}</div><div class="small">mapped groups</div></div><div class="card"><div class="metric">${Object.keys(PARADIGM_COUNTS).length}</div><div class="small">paradigms</div></div></div><div class="card"><h3>Visible paradigm mix</h3>${top.map(([k,c])=>`<div class="rowitem"><div>${esc(k)}<div class="bar"><div style="width:${100*c/max}%"></div></div></div><b>${c}</b></div>`).join("")}</div><div class="card"><h3>How to explore</h3><div class="small">Use <b>Layout</b> for organization, <b>Color</b> for interpretation, and a <b>Story</b> for a curated scientific question. These controls are independent.</div></div>`}
function renderDetails(){const p=document.getElementById("panel");if(!currentSelection){renderOverview();return}const n=byId[currentSelection];if(!n)return;let h=`<h2 style="margin-top:0">${esc(n.label)}</h2><div class="small">${esc(n.type)}${n.year?" · "+esc(n.year):""}${n.journal?" · "+esc(n.journal):""}</div>`;if(n.type==="paper"){h+=`<div style="margin:8px 0"><span class="tag">${esc(n.paradigm)}</span>${(n.groups||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`;if(n.url)h+=`<a class="paperLink" href="${esc(n.url)}" target="_blank">Open paper</a>`;h+=`<button id="compareThis" type="button">${compareIds.includes(n.id)?"Remove from compare":"Add to compare"}</button>`;if(n.chemistry)h+=`<div class="card"><h3>Chemistry</h3><div class="small">${esc(n.chemistry)}</div></div>`;if(n.data_regime)h+=`<div class="card"><h3>Data regime</h3><div class="small">${esc(n.data_regime)}</div></div>`;if(n.validation)h+=`<div class="card"><h3>Validation</h3><div class="small">${esc(n.validation)}</div></div>`;if(n.why)h+=`<div class="card"><h3>Why it matters</h3><div class="small">${esc(n.why)}</div></div>`;h+=`<div class="card"><h3>Metadata</h3><div class="small"><b>Authors:</b> ${esc((n.derived_authors||[]).join(", ")||"—")}<br><b>Topics:</b> ${esc((n.derived_topics||[]).join(", ")||"—")}<br><b>Methods:</b> ${esc((n.derived_methods||[]).join(", ")||"—")}</div></div>`}const conn=[];currentData.links.forEach(l=>{let a=eid(l.source),b=eid(l.target);if(a===n.id)conn.push([b,l]);else if(b===n.id)conn.push([a,l])});if(conn.length)h+=`<div class="card"><h3>Related in current view</h3>`+conn.sort((a,b)=>(b[1].score||0)-(a[1].score||0)).slice(0,30).map(([id,l])=>`<div class="rowitem" data-node="${id}"><div>${esc(byId[id]?.label||id)}<div class="small">${l.relation==="paper_similarity"?"score "+(l.score||"")+" · "+esc(l.reason||""):esc(l.relation)}</div></div><div>›</div></div>`).join("")+`</div>`;p.innerHTML=h;p.querySelector("#compareThis")?.addEventListener("click",()=>addCompare(n.id));p.querySelectorAll("[data-node]").forEach(el=>el.addEventListener("click",()=>selectNode(el.dataset.node)))}
function renderPapers(){const p=document.getElementById("panel"),ps=currentData.nodes.filter(n=>n.type==="paper").sort((a,b)=>(b.year||0)-(a.year||0)||a.label.localeCompare(b.label));p.innerHTML=`<div class="card"><h3>Visible papers</h3><div class="small">${ps.length} papers after current filters.</div></div>`+ps.map(x=>`<div class="card rowitem" data-paper="${x.id}"><div><b>${esc(x.label)}</b><div class="small">${esc(x.year)} · ${esc(x.journal)}<br>${esc(x.paradigm)}</div></div><div>›</div></div>`).join("");p.querySelectorAll("[data-paper]").forEach(el=>el.addEventListener("click",()=>selectNode(el.dataset.paper)))}
function renderRank(type,title){const p=document.getElementById("panel"),counts=new Map();currentData.nodes.filter(n=>n.type==="paper").forEach(x=>{const vals=type==="groups"?(x.groups||[]):type==="topics"?(x.derived_topics||[]):[];vals.forEach(v=>counts.set(v,(counts.get(v)||0)+1))});const arr=[...counts.entries()].sort((a,b)=>b[1]-a[1]),max=arr[0]?.[1]||1;p.innerHTML=`<div class="card"><h3>${title}</h3></div>`+arr.map(([k,c])=>`<div class="card"><b>${esc(k)}</b><div class="bar"><div style="width:${100*c/max}%"></div></div><div class="small">${c} visible papers</div></div>`).join("")}
function renderCompare(){const p=document.getElementById("panel"),ps=compareIds.map(id=>byId[id]).filter(Boolean);if(!ps.length){p.innerHTML=`<div class="card"><h3>Compare papers</h3><div class="small">Open a paper and choose <b>Add to compare</b>. You can compare up to four.</div></div>`;return}const rows=[["Year",x=>x.year],["Journal",x=>x.journal],["Paradigm",x=>x.paradigm],["Group",x=>(x.groups||[]).join(", ")],["Chemistry",x=>x.chemistry],["Data",x=>x.data_regime],["Validation",x=>x.validation],["Methods",x=>(x.derived_methods||[]).join(", ")],["Why it matters",x=>x.why]];p.innerHTML=`<div class="card"><h3>Compare ${ps.length} papers</h3><button id="clearCompare">Clear</button></div><div class="card" style="overflow-x:auto"><table><tr><th>Field</th>${ps.map(x=>`<th>${esc(x.label)}<br><a href="${esc(x.url||"#")}" target="_blank">open</a></th>`).join("")}</tr>${rows.map(([lab,fn])=>`<tr><th>${lab}</th>${ps.map(x=>`<td>${esc(fn(x)||"—")}</td>`).join("")}</tr>`).join("")}</table></div>`;p.querySelector("#clearCompare").addEventListener("click",()=>{compareIds=[];document.getElementById("compareBadge").textContent="Compare 0";renderCompare()})}
function renderCurrent(){if(currentTab==="overview")renderOverview();else if(currentTab==="details")renderDetails();else if(currentTab==="papers")renderPapers();else if(currentTab==="groups")renderRank("groups","Groups in current view");else if(currentTab==="topics")renderRank("topics","Topics in current view");else if(currentTab==="compare")renderCompare()}function activateTab(t){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t))}document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{currentTab=b.dataset.tab;activateTab(currentTab);renderCurrent()}));document.getElementById("compareBadge").addEventListener("click",()=>{currentTab="compare";activateTab("compare");renderCompare()});
const sb=document.getElementById("storybar");Object.entries(STORIES).forEach(([id,s])=>{const b=document.createElement("button");b.className="story";b.textContent=s.label;b.title=s.description;b.dataset.story=id;b.addEventListener("click",()=>{activeStory=activeStory===id?null:id;document.querySelectorAll("[data-story]").forEach(x=>x.classList.toggle("active",x.dataset.story===activeStory));buildData()});sb.appendChild(b)});
["q","view","year","density"].forEach(id=>document.getElementById(id).addEventListener(id==="q"?"input":"change",()=>{clearSelection();buildData()}));document.getElementById("layout").addEventListener("change",()=>applyLayout(document.getElementById("layout").value,true));document.getElementById("colorby").addEventListener("change",()=>{Graph.nodeColor(nodeColor);updateHud()});document.getElementById("labels").addEventListener("change",applyLabels);document.getElementById("focus").addEventListener("change",()=>{if(currentSelection){const id=currentSelection;currentSelection=null;selectNode(id)}});["hideReviews","hideIsolates"].forEach(id=>document.getElementById(id).addEventListener("change",buildData));document.getElementById("center").addEventListener("click",()=>Graph.zoomToFit(600,55));document.getElementById("reset").addEventListener("click",()=>{document.getElementById("q").value="";document.getElementById("view").value="papers";document.getElementById("layout").value="free";document.getElementById("colorby").value="paradigm";document.getElementById("labels").value="hover";document.getElementById("year").value="all";document.getElementById("density").value="normal";document.getElementById("focus").value="1";document.getElementById("hideReviews").checked=false;document.getElementById("hideIsolates").checked=false;activeStory=null;currentSelection=null;document.querySelectorAll("[data-story]").forEach(x=>x.classList.remove("active"));buildData()});document.getElementById("exportCsv").addEventListener("click",()=>{const ps=currentData.nodes.filter(n=>n.type==="paper"),cols=["year","label","journal","paradigm","groups","url"];let csv=cols.join(",")+"\n"+ps.map(p=>cols.map(k=>`"${String(k==="groups"?(p.groups||[]).join("; "):(p[k]??"")).replaceAll('"','""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="visible_catalysis_papers.csv";a.click();URL.revokeObjectURL(a.href)});window.addEventListener("resize",()=>Graph.width(document.getElementById("graphwrap").clientWidth).height(document.getElementById("graphwrap").clientHeight));buildData();renderOverview();
</script>
