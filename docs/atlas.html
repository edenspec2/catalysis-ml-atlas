<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<meta name="description" content="Rotate the catalysis ML knowledge graph. Filter by chemistry, representation, story, and year. Auto-rotate stays off.">
<title>3D atlas · Catalysis ML</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="atlas-page">
<a class="skip" href="#papers">Skip to papers</a>
<header>
  <a class="brand" href="./">C<span class="brand-dot">·</span>ML <span>Catalysis atlas</span></a>
  <nav class="header-nav" aria-label="App">
    <a href="./">Library</a>
    <a href="atlas.html" aria-current="page">3D atlas</a>
  </nav>
</header>
<div class="atlas-controls">
  <div class="atlas-top">
    <label class="atlas-search"><span>Search</span><input type="search" id="q" placeholder="Milo, ligands, transfer…" autocomplete="off"></label>
    <div class="storybar" id="storybar" role="toolbar" aria-label="Research stories"></div>
  </div>
  <div class="atlas-filters">
    <label><span>View</span>
      <select id="view">
        <option value="papers" selected>Papers only</option>
        <option value="papers_authors">Papers + authors</option>
        <option value="papers_topics">Papers + topics</option>
        <option value="papers_methods">Papers + methods</option>
        <option value="papers_workflows">Papers + workflows</option>
        <option value="full">Full metadata graph</option>
      </select>
    </label>
    <label><span>Layout</span>
      <select id="layout">
        <option value="free" selected>Layout: network</option>
        <option value="year">Layout: timeline</option>
        <option value="paradigm">Layout: paradigms</option>
        <option value="representation">Layout: representation</option>
        <option value="group">Layout: PI / group</option>
      </select>
    </label>
    <label><span>Color</span>
      <select id="colorby">
        <option value="paradigm" selected>Color: paradigm</option>
        <option value="representation">Color: representation</option>
        <option value="group">Color: PI / group</option>
        <option value="year">Color: year</option>
        <option value="type">Color: node type</option>
      </select>
    </label>
    <label><span>Chemistry</span><select id="chemistry"><option value="all">All chemistry</option></select></label>
    <label><span>Representation</span><select id="representation"><option value="all">All representations</option></select></label>
    <label><span>Year</span>
      <select id="year">
        <option value="all">All years</option>
        <option value="2026">2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="older">2022 and earlier</option>
      </select>
    </label>
    <button type="button" id="center">Fit</button>
    <button type="button" id="reset">Reset</button>
    <label class="check"><input type="checkbox" id="showFigs" checked> Figure 1</label>
  </div>
  <details class="atlas-more">
    <summary>More graph options</summary>
    <div class="atlas-filters">
      <label><span>Links</span>
        <select id="density">
          <option value="sparse">Sparse links</option>
          <option value="normal" selected>Normal links</option>
          <option value="dense">Dense links</option>
        </select>
      </label>
      <label><span>Labels</span>
        <select id="labels">
          <option value="papers" selected>Paper labels</option>
          <option value="selected">Selected label</option>
          <option value="all">All labels</option>
          <option value="hover">Hover only</option>
        </select>
      </label>
      <label><span>Focus hops</span>
        <select id="focus">
          <option value="1" selected>1 hop</option>
          <option value="2">2 hops</option>
          <option value="3">3 hops</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="hideReviews"> Hide reviews</label>
      <label class="check"><input type="checkbox" id="hideIsolates"> Hide isolates</label>
    </div>
  </details>
</div>
<div class="atlas-shell">
  <div class="atlas-stage">
    <div id="graph" role="img" aria-label="Interactive 3D research graph. Paper list and details are available beside or below the graph."></div>
    <div class="atlas-hud">
      <div class="hudbox" id="status">Loading atlas…</div>
      <div class="hudbox" id="legend"></div>
    </div>
    <p class="atlas-hint">Drag to rotate · pinch to zoom · Fit spreads the view. Auto-rotate stays off.</p>
  </div>
  <aside id="side">
    <div id="selection" hidden></div>
    <div class="side-head">
      <h2>Papers in view</h2>
      <span id="paper-count"></span>
    </div>
    <div id="papers" tabindex="-1"></div>
  </aside>
</div>
<dialog id="figbox">
  <div class="dialog-top"><span class="eyebrow">FIGURE</span><button type="button" id="close-fig" aria-label="Close figure">Close ✕</button></div>
  <img id="figbox-img" alt="">
  <p id="figbox-cap" class="muted"></p>
</dialog>
<script src="atlas.js?v=15"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
