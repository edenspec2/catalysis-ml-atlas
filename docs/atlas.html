<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Rotate the catalysis ML knowledge graph in 3D. Filter by topic, chemistry and year.">
<title>3D Map · Catalysis ML</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="atlas-page">
<a class="skip" href="#papers">Skip to papers</a>
<header>
  <a class="brand" href="./" aria-label="Catalysis ML Atlas"><img class="logo" src="icon.svg" alt="" width="24" height="24"><span>Catalysis ML Atlas</span></a>
  <nav class="header-nav" aria-label="App">
    <a href="./">Library</a>
    <a href="atlas.html" aria-current="page">3D Map</a>
    <a href="lab.html">Lab guide</a>
  </nav>
</header>
<div class="atlas-controls">
  <label class="atlas-search"><span>Search</span><input type="search" id="q" placeholder="Search the map" autocomplete="off"></label>
  <label><span>Topic</span><select id="story"><option value="">All topics</option></select></label>
  <label><span>Arrange</span>
    <select id="layout">
      <option value="free" selected>Arrange: network</option>
      <option value="year">Arrange: timeline</option>
      <option value="paradigm">Arrange: paradigm</option>
      <option value="representation">Arrange: representation</option>
      <option value="group">Arrange: PI / group</option>
    </select>
  </label>
  <label><span>Color</span>
    <select id="colorby">
      <option value="paradigm" selected>Color: paradigm</option>
      <option value="representation">Color: representation</option>
      <option value="group">Color: PI / group</option>
      <option value="year">Color: year</option>
    </select>
  </label>
  <button type="button" id="center">Fit</button>
  <button type="button" id="reset">Reset</button>
  <details class="menu">
    <summary>Filters</summary>
    <div class="menu-pop">
      <label><span>Chemistry</span><select id="chemistry"><option value="all">All chemistry</option></select></label>
      <label><span>Year</span>
        <select id="year">
          <option value="all">All years</option>
          <option value="2026">2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="older">2022 and earlier</option>
        </select>
      </label>
      <label><span>Show</span>
        <select id="view">
          <option value="papers" selected>Papers only</option>
          <option value="papers_authors">Papers + authors</option>
          <option value="papers_topics">Papers + topics</option>
          <option value="papers_methods">Papers + methods</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="showFigs" checked> Figures</label>
    </div>
  </details>
</div>
<div class="atlas-shell">
  <div class="atlas-stage">
    <div id="graph" role="img" aria-label="Interactive 3D research graph. Paper list and details are available beside or below the graph."></div>
    <div class="atlas-hud">
      <div class="hudbox" id="status">Loading atlas…</div>
      <div class="hudbox" id="legend"></div>
    </div>
    <p class="atlas-hint">Drag to rotate · Shift-drag to pan · Scroll to zoom</p>
  </div>
  <aside id="side">
    <div id="selection" hidden></div>
    <div class="side-head">
      <h2>Papers in view</h2>
      <span id="paper-count"></span>
    </div>
    <div id="papers" tabindex="0" aria-label="Papers in this view. Arrow keys or J and K move through the list."></div>
  </aside>
</div>
<dialog id="figbox">
  <div class="dialog-top"><span class="eyebrow">FIGURE</span><button type="button" id="close-fig" class="round" aria-label="Close figure">✕</button></div>
  <img id="figbox-img" alt="">
  <p id="figbox-cap" class="muted"></p>
</dialog>
<script src="atlas.js?v=25"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
